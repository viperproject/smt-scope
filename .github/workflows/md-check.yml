name: Check markdown files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/md-check.yml'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/md-check.yml'
      - '**/*.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - uses: gaurav-nelson/github-action-markdown-link-check@v1
