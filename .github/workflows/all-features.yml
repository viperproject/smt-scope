name: Check features matrix compiles
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  all-features:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup `Cargo.lock` for caching
      run: cargo generate-lockfile
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "all-features"
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - run: cargo install cargo-all-features
    - name: Check all lib features
      run: |
        cd smt-scope-lib
        RUSTFLAGS="-D warnings" cargo check-all-features --release
    - name: Check all gui features
      run: |
        cd smt-scope-gui
        RUSTFLAGS="-D warnings" cargo check-all-features --release
